spring.application.name=kaodian-server

# —— 跨域 ——
# 开发期前端跑在 Vite dev server 上。允许谁访问写在这里而不是散在 @CrossOrigin 上:
# 跨域是部署形态的事,不是某个端点的事。上线后前后端同源(Caddy 静态直出 + /api 反代),
# 这一行改成空值即可,代码不动。见 ApiCorsConfig。
kaodian.api.cors.allowed-origins=http://localhost:5173

# —— 鉴权:供应商开关 ——
# 🔴 三个默认值构成一个【零成本、零外部依赖】的本机组合:
#   短信不真发、滑块不真校验、微信整个关着。
# 它们之间有一条被启动期强制的配对(AuthBeans#checkVendorPairing):
#   短信一旦切成 tencent,滑块也必须切成 tencent,否则【拒绝启动】——
#   「真短信 + 不校验滑块」是唯一一种会被无限刷短信费的组合,而它恰好是
#   「先把短信配上,验证码回头再说」这个最自然的接入顺序会产生的中间状态。
kaodian.auth.sms.provider=logging
kaodian.auth.captcha.provider=disabled

# 微信登录:docs/技术架构 §7.2 定的是【关卡 2 后】。
# 三条入口(小程序 / 公众号 H5 / 网站扫码)是三个不同的应用,各要一笔认证费与一次审核;
# 小程序还依赖 ICP 备案。在关卡 2 之前掏这笔钱,买的是一个还没被验证的方向。
kaodian.auth.wechat.enabled=false

# 🔴 拿不到 unionid 时【直接失败】,而不是降级用 openid 建账号。
# 拿不到 unionid 的原因只有一个:这个应用没绑到微信开放平台账号 —— 那是控制台配置,不是运行时状况。
# 所以【有开放平台账号且绑定做对了的话,unionid 必然存在】,拿不到就是配置坏了。
# 降级的后果是攒出一批 wx_open 账号,等着将来靠 R-63 那条自愈路径去修 —— 能修,但本来不该发生。
#
# ⚪ 确知没有开放平台账号、且接受「同一个人从不同入口进会得到两个账号」时,可置 false。
kaodian.auth.wechat.require-unionid=true

# 短信频控里「日」按哪个时区算。用户说的「明天」是北京时间的明天 ——
# 用 UTC 算,「明天 0 点恢复」这句话在晚上 8 点之后就是错的,
# 而给出准确时点正是整套设计的要点(docs/后端详设 §1.8)。
kaodian.auth.sms.zone=Asia/Shanghai

# —— 时间线聚合 ——
# 🔴 /api/timeline 按哪个时区切「一天」。用户说的「今天」是北京时间的今天。
# 用 UTC 切,北京时间当天 0 点到 8 点记的那几笔会被算进「昨天」——
# 用户刚记完就翻开时间线,看到的是「昨天 3 条、今天 0 条」。
# 与上面 kaodian.auth.sms.zone 是同一条决定,理由也是同一条。
#
# 但不复用那个键:那一条属于短信频控。将来真要给境外号码另切一个短信「日」,
# 改那个键会连带把整条时间线重新分桶 —— 两件毫不相干的事共用一个开关,
# 出事的方式一定是「改了 A 坏了 B,而且没人往那边看」。
kaodian.api.timeline.zone=Asia/Shanghai

# 🔴 默认不信任 X-Forwarded-For。这个头客户端可以随便写,
# 信任它而前面没有反代 = 「单 IP 20/日」这道闸永远不触发。
# 线上有同机 Caddy 反代时才置 true(见 ClientIp)。
kaodian.auth.trust-forwarded-for=false

# —— 鉴权:密钥 ——
# 手机号不明文落库(docs/技术架构 §5.2):HMAC 用于查,AES 用于发短信。
# 这两项留空时会在数据目录下自动生成 auth-keys.properties(权限 600)供本机开发用。
# 🔴 那个文件属于【数据】不属于配置 —— 换一把 HMAC 密钥 = 全部老用户静默登不回原账号。
# 生产用环境变量:KAODIAN_AUTH_KEYS_PHONE_HMAC / KAODIAN_AUTH_KEYS_PHONE_AES(base64,32 字节)
# kaodian.auth.keys.phone-hmac=
# kaodian.auth.keys.phone-aes=

# —— 鉴权:换钥(R-59 的守卫,见 PhoneKeyGuard)——
# 启动期会把当前密钥的【指纹】与账号数据上盖的那个比一次。四种情形四种处置:
#   指纹一致                    → 放行
#   库里没盖过章                → 补盖 + WARN(本机制上线前的老数据)
#   只有 HMAC 变了、AES 没变     → 【自动换钥,零账号丢失】密文还能解出手机号,重算一遍即可
#   AES 也变了                  → 【拒绝启动】手机号明文拿不回来,继续跑 = 一边接客一边毁数据
#
# 有计划的双钥轮换:把旧的两把填在这里,启动时自动换钥(只换一把时另一把留空即可)。
# kaodian.auth.keys.phone-hmac-previous=
# kaodian.auth.keys.phone-aes-previous=
#
# 🔴 确实丢了、接受这批账号成为孤儿时才置 true。它不是「跳过检查」,是一次不可逆的确认:
# 那些用户再次登录会被当成新用户建号,SignupLedger 上会多出【非真实】注册,
# 而那是关卡 3 判据的数据源 —— 需要人工扣减。日志里会留下确切条数。
kaodian.auth.keys.accept-key-loss=false

# —— JSON 契约 ——
# 🔴 未定义字段一律拒绝。这是 R-07 的第二道锁:
# DTO 里没有 name/label/tag 这类字段是第一道,但默认配置下 Jackson 会【安静地忽略】多余字段,
# 于是 {"tag":"自己想的考点"} 也返回 200,调用方以为它生效了。打开这个开关后它当场 400。
#
# 键名必须是 Jackson 枚举常量的原名(大写下划线):Boot 4 绑定
# Map<DeserializationFeature, Boolean> 时不做松散命名转换,写成 kebab-case 会直接启动失败。
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=true

# 时间一律 ISO-8601 带时区(docs/技术架构 §六),不是 epoch 数字。
# 三端 + MCP + 导出都读同一份时间格式,数字时间戳会让每个消费方各自造一次转换。
# Jackson 3 把这个开关从 SerializationFeature 挪到了 DateTimeFeature,前缀随之变成
# spring.jackson.datatype.datetime。写在这里是显式声明契约 —— 虽然 Jackson 3 的默认值已经是它。
spring.jackson.datatype.datetime.WRITE_DATES_AS_TIMESTAMPS=false

# —— multipart:🔴 R-04 的一条配置层落点(见 RecognitionController / AudioRetentionTest)——
# 只有一个 multipart 端点:POST /records/{id}/audio。
#
# 🔴 file-size-threshold 的默认值是 0,含义是【每个 part 一律先写成一个临时文件】。
# 也就是说,不写下面这三行的话,每一段上传的音频都会落到容器的临时目录里 ——
# 而 docs/技术架构 §5.2「不建的表」那一行写的是「任何音频表 —— 1.1.1.5:ASR 失败提示重录,不留存音频」,
# §8.1 禁令 2 写的是「服务端不写磁盘」。它不在任何一行 Java 代码里,不会报错,
# 也不会出现在任何 code review 里 —— 与 §8.1 禁令 5 说的反代落盘是同一类破口。
#
# 所以把阈值抬到上限【之上】:一段音频最大 6 MiB,而 8MB 才开始落盘 = 永远不落盘。
# 三个数的大小关系(RecognitionController.MAX_AUDIO_BYTES ≤ max-file-size ≤ file-size-threshold)
# 由 AudioRetentionTest 钉住 —— 散在两个文件里的三个数迟早对不上。
#
# 为什么图片端点不在这一节里:它【不是 multipart】。docs/技术架构 §6.2 的原文是
# 「🔴 JSON body,base64 内联,不是 multipart 落盘」,那一条靠的是形态而不是配置。
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
spring.servlet.multipart.file-size-threshold=8MB

# —— 监听地址 ——
# 🔴 只绑回环口。默认值是 0.0.0.0,也就是「同一个 wifi 下的任何人都能连上来」,
# 而这一版起 /api/syllabus/* 是可写的:archive / delete / rename / order 都不需要请求体,
# 也没有任何身份认证。少了这一行,咖啡馆里任何人 curl 一下就能悄悄归档掉你的考点 ——
# 覆盖率是这个产品唯一的那个数,它被外人改掉而用户毫无察觉,是最不能出的错。
#
# 跨域白名单挡不住这个:Spring 只在请求带着不匹配的 Origin 时才回 403,
# 而 curl 根本不发 Origin 头。CORS 防的是浏览器里的第三方页面,不是网内的直连。
#
# 两端都不受影响:dev 是 vite proxy 从本机转发到 :8080,生产是同机 Caddy 反代,
# 都走回环。真要从别的机器访问,那是一次要先回答「怎么认证」的部署决定(docs/技术架构 §7.4)。
server.address=127.0.0.1

# —— 错误响应 ——
# 🔴 堆栈与异常信息只进服务端日志,不进响应体。前端拿到的是 ApiExceptionHandler 出的
# {code, message, traceId},出问题时用户只需要念那串 traceId。
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ════════════════════════════ Agent 运行时 ════════════════════════════

# 🔴 R-51 的那对配置。上面那行是 key,下面那段是 exclude —— 【它们是一对,不许只有一个】。
#
# spring-ai-starter-model-openai 会把 chat / embedding / image / audio-speech /
# audio-transcription / moderation 【六套】模型一起自动装配。我们只要 chat 一个。
# 多出来的五个不是浪费,是【技术上随时可用的越界能力】:一个装配好的 OpenAiImageModel
# 意味着「让模型画个图」不需要任何人写新代码,只需要有人 @Autowired 它一下。
# 而能力边界(只答「有没有、几次、多久前」)是这个产品的产品定义本身,不是事后能补的规范。
#
# ⚠ 2026-08-28 实测:spring-ai 2.0.1 的自动装配类一共【六个】,不是 docs/后端详设 §4.2 写的三个。
# 那份清单写于探针阶段,漏了 audio-transcription 与 moderation。moderation 尤其不能漏 ——
# 它在 NoGenerativeModelBeanTest 的禁令表里,理由是「内容审核要求把内容送出去,而我们不碰内容」。
# 已回写 docs/后端详设 §4.2。清单以 jar 里的 AutoConfiguration.imports 为准,不以记忆为准:
#   unzip -p .../spring-ai-autoconfigure-model-openai-2.0.1.jar \
#     META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

# 🔴 密钥只走环境变量,不进仓库(docs/后端详设 §4.2 / R-08)。
# 默认空值 = 没有密钥 = StubAgentLlm 生效(见 AgentLlm)。空值不会让上下文起不来:
# chat 那一套是懒加载的,被排除掉的 audio-speech 才是「没 key 就炸」的那个。
spring.ai.openai.api-key=${KAODIAN_MODEL_KEY:}
#
# —— 默认走 OpenRouter 的【免费】模型:关卡 0 之前不该为一个还没人用的功能付费 ——
#
# 04 的止损线与 05 的「不在关卡通过前花钱」是同一条纪律,鉴权层的默认组合(不发真短信、
# 不校验滑块、微信整个关着)也是照这条来的。agent 照办:默认模型选免费的那一档。
#
# 🔴 免费不等于能用。免费模型里【大多数不支持工具调用】,而工具是这个 agent 的全部价值 ——
#    没有工具它就只能凭空说话,那正是能力边界要挡住的事。选之前必须实测两件事:
#      ① 流式 + tool_calls 能不能跑通;② 会不会守住「不判断对错」。
#
# 2026-08-28 实测(OpenRouter 380 个模型中 21 个免费,其中 18 个声称支持 tools):
#   ✅ minimax/minimax-m3:free                 工具 ✓ 边界 ✓  ← 当前默认(1M 上下文)
#   ✅ minimax/minimax-m2.7:free               工具 ✓(边界未逐一验证)
#   ✅ nvidia/nemotron-3-super-120b-a12b:free  工具 ✓(边界未逐一验证)
#   ✗ z-ai/glm-5.2:free / google/gemma-4-31b-it:free   Provider returned error
#
# ⚠ 刻意【不】用 openrouter/free 那个自动路由:它每次可能落到不同模型上,
#   而下面 temperature=0 的全部意义就是「同一个问题给同一个答案」——
#   路由器会让那行配置失效,且失效得毫无痕迹。
#
# ⚠ 免费档有速率限制,连续压测会 429(agent 会翻成一帧 llm_rate_limited,不断流)。
#
# 查当前还有哪些免费模型(模型表天天在变,不要照抄上面那几行):
#   curl -s https://openrouter.ai/api/v1/models | python3 -c "import sys,json;\
#     d=json.load(sys.stdin)['data'];\
#     print('\n'.join(m['id'] for m in d if float(m['pricing']['prompt'])==0 \
#       and 'tools' in (m.get('supported_parameters') or [])))"
#
# 换回付费/自建端点:DeepSeek(https://api.deepseek.com,模型 deepseek-chat)与
# 百炼(https://dashscope.aliyuncs.com/compatible-mode/v1)都提供 OpenAI 兼容端点,
# 改这两行即可,代码一行不动(docs/后端详设 §三 的结论就是靠这一点成立的)。
spring.ai.openai.base-url=${KAODIAN_MODEL_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.options.model=${KAODIAN_AGENT_MODEL:minimax/minimax-m3:free}
# 0:同一个问题给同一个答案。覆盖率是这个产品唯一的那个数,它的解释不该每次都不一样。
spring.ai.openai.chat.options.temperature=0

# Agent 的落盘根目录。run.json + 三个 ndjson,没有数据库(docs/技术架构 §零:阶段 0/1 是本地文件)。
kaodian.agent.storage.root=${KAODIAN_AGENT_ROOT:${user.home}/.kaodian/agent}

# 单轮 ReAct 的工具循环上限。超过即以 TOOL_LOOP_LIMIT 收尾,不是无限循环。
kaodian.agent.max-tool-rounds=4
