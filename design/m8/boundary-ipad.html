<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>U8.1 这个产品不做什么 · iPad 竖屏 720–1023 · Kubic v10</title>

              background:var(--ground);display:flex;flex-direction:column;overflow:hidden}

</style></head><body><div class="pad-screen">

<div class="inner">
  <div class="head"><span>设置 · 关于</span><span>离线可读</span></div>

  <div style="padding:56px var(--rule) 0">
    <p class="display" style="font-size:36px;line-height:48px">这个产品不做什么</p>
    <p class="sub" style="margin-top:14px">下面这些事它都不做,不是还没做。</p>

  <div style="height:28px"></div>

  <div class="line">
    <span class="idx">一</span>
    <span class="line__main"><span class="body">它不判断你答得对不对,也不给你讲题。它只记录你碰过什么、碰过几次、多久以前。</span></span>
  </div>
  <div class="line">
    <span class="idx">二</span>
    <span class="line__main"><span class="body">它不存你的题目内容。数据库里没有能装题干的地方。</span></span>
  </div>
  <div class="line">
    <span class="idx">三</span>
    <span class="line__main"><span class="body">你拍的原图只存在这台设备上,不上传、不同步、不备份到任何服务器。</span></span>
  </div>
  <div class="line">
    <span class="idx">四</span>
    <span class="line__main"><span class="body">它不会提醒你学习,不给你排计划,也不给你发徽章。</span></span>
  </div>
  <div class="line">
    <span class="idx">五</span>
    <span class="line__main"><span class="body">要判断先学哪个,把差集导出来交给你自己接的 AI —— 学科判断不是这个产品干的事。</span></span>
  </div>

  <div style="flex:1 1 auto"></div>
  <div class="foot"><p>这一页写的是产品边界。它变了,产品就变了。</p></div>
</div>

</div></body></html>
