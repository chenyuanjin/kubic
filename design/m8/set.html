<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>U8.2 设置 · S-SET 主态 · Kubic v10</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="v10.css"><style>
  body{zoom:2}
  /* S-SET：四组台账，零开关、零输入框、零骨架屏。
     不是后台设置页：没有分组卡片、没有右箭头、没有开关矩阵——
     全部条目都是台账行（上行条目、下行事实），可点行整行热区。
     危险条目（清空）= 普通行 + 次要色文字，红色只出现在浮层确认位。
     内容区 0 块蓝面：设置讲的是数据，不是盲区。 */
  .grp{padding:14px var(--rule) 4px}
  .line{padding-top:11px;padding-bottom:11px}
</style></head><body><div class="phone">

</span></div>
