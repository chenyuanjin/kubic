<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>U1.1 记录入口（拍照）· Kubic v10</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="v10.css"><style>
  body{zoom:2}
  /* 留存三处：同意留存那一刻 / 到期倒计时 / 立即删除。
     三样同处一个区块、同一条左边线、同一号字 —— 谁都不比谁小一号。
     倒计时与后果的两句都是真源原文：E-RAW-13 展示句 + §6.4 附加句，界面不自造语义。
     这一屏内容区 0 块蓝面：留存讲的是原图，不是盲区。 */
  .shot{margin:0 var(--rule);height:216px;background:var(--raised);
        border:var(--hair-w) solid var(--hair);border-radius:var(--radius);
        display:flex;align-items:flex-end;padding:12px 14px}
  .shot span{font-size:var(--t-micro);color:var(--ink-2)}
  .keep{padding:8px 0 4px}
  .keep .line{padding-top:14px;padding-bottom:14px}
  .box{width:18px;height:18px;flex:0 0 auto;margin-top:3px;border-radius:var(--radius);
       background:var(--ink);display:flex;align-items:center;justify-content:center}
  /* 模式段控 C-DISC：四入口收敛在同一个记录入口下，段控切换、不做四个并列大按钮 */
  .seg{display:flex;border-bottom:var(--hair-w) solid var(--hair)}
  .seg button{flex:1;height:48px;display:flex;align-items:center;justify-content:center;
              font-size:var(--t-sub);color:var(--ink-2)}
  .seg button+button{border-left:var(--hair-w) solid var(--hair)}
  .seg button[aria-current="true"]{color:var(--ink);font-weight:600;
              box-shadow:inset 0 -1.5px 0 var(--ink)}
</style></head><body><div class="phone">

<div class="sb"><span>21:47</span><span class="sb__r">
  <span class="sb__s"><i></i><i></i><i></i><i></i></span><span class="sb__b"></span>
</span></div>

<div class="flow">
  <div class="head"><span>记一条 · 图片</span><span>21:47</span></div>

  <div class="seg">
    <button type="button">写</button>
    <button type="button">说</button>
    <button type="button" aria-current="true">拍</button>
    <button type="button">做题</button>
  </div>

  <div style="height:16px"></div>
  <div class="shot"><span>原图 · 只在这台设备上</span></div>

  <div class="keep">
    <!-- ① 用户同意留存原图的那一刻 -->
    <div class="line">
      <span class="slot"><span class="box"><svg width="11" height="9" viewBox="0 0 11 9" fill="none">
        <path d="M1 4.6 4.1 7.7 10 1.4" stroke="var(--on-action)" stroke-width="1.8"
              stroke-linecap="square"/></svg></span></span>
      <span class="line__main">
        <span class="body">留下这张原图</span>
        <span class="sub">你拍的原图只存在这台设备上,不上传、不同步、不备份到任何服务器。</span>
      </span>
    </div>
    <!-- ② 原图的到期倒计时（E-RAW-13 原文 + 附加句原文） -->
    <div class="line">
      <span class="slot"><svg width="13" height="16" viewBox="0 0 18 22" fill="none" style="margin-top:4px">
        <path d="M9 1 17 5.6 9 10.2 1 5.6Z" stroke="var(--ink-2)" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M1 8.4 9 13 9 21 1 16.4Z" stroke="var(--ink-2)" stroke-width="1.1" stroke-linejoin="round" opacity=".5"/>
        <path d="M17 8.4 9 13 9 21 17 16.4Z" stroke="var(--ink-2)" stroke-width="1.1" stroke-linejoin="round" opacity=".5"/>
      </svg></span>
      <span class="line__main">
        <span class="body">还有 2 天 6 小时转进留存区</span>
        <span class="sub">2 天 6 小时后转为本机留存,不再用于识别,随时可以手动删。</span>
      </span>
    </div>
    <!-- ③ 随时可按的立即删除入口：同号字，不小一号、不折叠 -->
    <div class="line">
      <span class="slot"></span>
      <span class="line__main"><button class="link link--body">立即删除原图</button></span>
    </div>
  </div>

  <div style="flex:1 1 auto"></div>

  <div class="field">
    <span class="eyebrow" style="flex:0 0 auto">来源</span>
    <input value="粉笔" readonly>
  </div>
</div>

<div class="dock">
  <button class="btn-pri">记下</button>
</div>
<div class="hi"></div>
</div></body></html>
