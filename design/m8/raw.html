<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>U8.4 原图管理 · S-RAW 主态 · Kubic v10</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="v10.css"><style>
  body{zoom:2}
  /* S-RAW:整屏零出站请求。列表用台账行,不是相册网格——
     每行 = 缩略图 + 文件名 + 🔴 逐行倒计时(E-RAW-13,不进详情才看得到)。
     固定区两行(计数行 + 常驻说明)不折进滚动区:滚一下就没了的承诺不算承诺。
     留存区分组始终排最后,不参与时间排序。
     没有分享 / 上传 / 备份 / 保存到相册 / 重命名 / 恢复。0 块蓝面。 */
</style></head><body><div class="phone">

<div class="sb"><span>21:47</span><span class="sb__r">
  <span class="sb__s"><i></i><i></i><i></i><i></i></span><span class="sb__b"></span>
</span></div>

<div class="flow">
  <div class="head"><span>设置 · 原图</span><button class="link" style="min-height:0;padding:0">选择</button></div>

  <div class="pad" style="padding-top:14px">
    <p class="body">37 张 · 占 128 MB · 都在这台设备上</p>
    <p class="sub" style="margin-top:2px">这些图只在这台设备上。换设备看不到,也没有任何地方备份。</p>
  </div>

  <div class="group group--split"><span class="eyebrow">今天</span></div>
  <button class="line line--tight" aria-label="IMG_0412,3 小时前存下的,还有 2 天 6 小时转进留存区,图片,双击查看">
    <span class="thumb thumb--s"><span>2481 × 1860</span></span>
    <span class="line__main">
      <span class="body">IMG_0412<span class="line__meta">3.4 MB</span></span>
      <span class="sub">还有 2 天 6 小时转进留存区</span>
    </span>
  </button>
  <button class="line line--tight" aria-label="IMG_0409,7 小时前存下的,还有 2 天 2 小时转进留存区,图片,双击查看">
    <span class="thumb thumb--s"><span>2481 × 1860</span></span>
    <span class="line__main">
      <span class="body">IMG_0409<span class="line__meta">2.9 MB</span></span>
      <span class="sub">还有 2 天 2 小时转进留存区</span>
    </span>
  </button>

  <div class="group group--split"><span class="eyebrow">昨天</span></div>
  <button class="line line--tight" aria-label="IMG_0398,昨天存下的,还有 1 天 4 小时转进留存区,图片,双击查看">
    <span class="thumb thumb--s"><span>3024 × 2268</span></span>
    <span class="line__main">
      <span class="body">IMG_0398<span class="line__meta">4.1 MB</span></span>
      <span class="sub">还有 1 天 4 小时转进留存区</span>
    </span>
  </button>

  <div class="group group--split"><span class="eyebrow">留存区 · 始终在最后</span><span class="eyebrow">12 张 · 41 MB</span></div>
  <button class="line line--tight" aria-label="IMG_0233,已在留存区,5 天前转进了留存区,图片,双击查看">
    <span class="thumb thumb--s"><span>留存</span></span>
    <span class="line__main">
      <span class="body body--2">IMG_0233<span class="line__meta">3.2 MB</span></span>
      <span class="sub">5 天前转进了留存区</span>
    </span>
  </button>
  <button class="line line--tight" aria-label="IMG_0219,已在留存区,8 天前转进了留存区,还没挂到任何一条记录上,图片,双击查看">
    <span class="thumb thumb--s"><span>留存</span></span>
    <span class="line__main">
      <span class="body body--2">IMG_0219<span class="line__meta">2.7 MB</span></span>
      <span class="sub">8 天前转进了留存区 · 没挂到记录上</span>
    </span>
  </button>

  <div style="flex:1 1 auto"></div>
  <div class="foot">
    <p>这台设备最多存 200 张 —— 满了会把最早的转进留存区,不会删</p>
  </div>
</div>

<div class="hi"></div>
</div></body></html>
