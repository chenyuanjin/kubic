  .pad-screen{position:relative;width:834px;height:1194px;background:var(--ground);
              display:flex;flex-direction:column;overflow:hidden;--rule:32px}
  .col{flex:1 1 auto;width:640px;margin:0 auto;display:flex;flex-direction:column;min-height:0}

     font-variant-numeric:tabular-nums lining-nums}

  .back{margin:-14px 0;padding:14px 10px 14px 0;font-size:var(--t-micro);color:var(--ink-2)}
  .secrow{display:flex;justify-content:space-between;align-items:center;min-height:44px;
          padding:0 var(--rule)}
</style></head><body><div class="pad-screen">

<div class="sb"><span>21:47</span><span class="sb__r">

  <div class="split" style="margin-top:6px"><button style="height:48px">去确认这一笔</button></div>

    <span class="eyebrow">说明</span>
    <button class="link">联系方式</button>
  </div>
