<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>U8.3 单张原图详情 · 留存三处 · Kubic v10</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="v10.css"><style>
  body{zoom:2}
  /* 单张详情:留存三处在这一屏全部第一层可指认——
     ① 承诺句(同意那一刻的延续,逐字同源) ② E-RAW-13 倒计时 + 附加句 ③ 立即删除原图。
     三样同一条左边线、同一号字,谁都不比谁小一号,不折叠、不进「更多」。
     长按大图不弹系统菜单;没有分享 / 保存到相册 / 恢复 / 重命名。
     删除的红色只出现在确认浮层里,本屏入口是同号文字按钮。0 块蓝面。 */
</style></head><body><div class="phone">

<div class="sb"><span>21:47</span><span class="sb__r">
  <span class="sb__s"><i></i><i></i><i></i><i></i></span><span class="sb__b"></span>
</span></div>

<div class="flow">
  <div class="head"><span>原图 · IMG_0412</span><span>21:47</span></div>

  <div style="height:16px"></div>
  <div class="shot" style="height:264px"><span>原图 · 本机读取 · 长按不弹菜单</span></div>

  <div class="keep" style="padding-top:8px">
    <!-- ① 同意那一刻的承诺,在这里延续,逐字同源 -->
    <div class="line">
      <span class="slot"></span>
      <span class="line__main">
        <span class="body">3 小时前存下的<span class="line__meta">占 3.4 MB</span></span>
        <span class="sub">你拍的原图只存在这台设备上,不上传、不同步、不备份到任何服务器。</span>
      </span>
    </div>
    <!-- ② 到期倒计时:E-RAW-13 原文 + §6.4 附加句原文 -->
    <div class="line">
      <span class="slot"><svg width="13" height="16" viewBox="0 0 18 22" fill="none" style="margin-top:4px">
        <path d="M9 1 17 5.6 9 10.2 1 5.6Z" stroke="var(--ink-2)" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M1 8.4 9 13 9 21 1 16.4Z" stroke="var(--ink-2)" stroke-width="1.1" stroke-linejoin="round" opacity=".5"/>
        <path d="M17 8.4 9 13 9 21 17 16.4Z" stroke="var(--ink-2)" stroke-width="1.1" stroke-linejoin="round" opacity=".5"/>
      </svg></span>
      <span class="line__main">
        <span class="body">还有 2 天 6 小时转进留存区</span>
        <span class="sub">2 天 6 小时后转为本机留存,不再用于识别,随时可以手动删。</span>
      </span>
    </div>
    <!-- ③ 随时可按的立即删除入口:同号字,不小一号、不折叠 -->
    <div class="line">
      <span class="slot"></span>
      <span class="line__main">
        <button class="link link--body">立即删除原图</button>
        <span class="sub">删了就没了,和它一起的记录还在</span>
      </span>
    </div>
  </div>

  <div style="flex:1 1 auto"></div>

  <div class="pad" style="padding-bottom:10px">
    <button class="link">看它属于哪条记录</button>
  </div>
</div>

<div class="hi"></div>
</div></body></html>
