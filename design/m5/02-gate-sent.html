<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>U5.2 登录门 · 已发码 + 页内错误 · Kubic v10</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="v10.css"><style>
  body{zoom:2}
  /* 已发码（SENT）+ 码错后的页内错误（ERROR_INLINE）：
     四种终态四句不同的话，这里画的是「输错 · 还能试几次」那一句。
     码错后验证码格清空、保持聚焦、手机号不清。整屏 0 块蓝面。 */
  .btn-ghost{display:flex;width:100%;height:52px;align-items:center;justify-content:center;
    border:1.5px solid var(--ink);border-radius:var(--radius);font-size:var(--t-btn);color:var(--ink)}
  .btn-ghost+.btn-ghost{margin-top:10px}
  .or{display:flex;align-items:center;gap:12px;margin:20px 0 16px}
  .or::before,.or::after{content:"";flex:1;border-top:var(--hair-w) solid var(--hair)}
  .or span{font-size:var(--t-micro);color:var(--ink-2)}
  .agree{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
  .agree .box{flex:0 0 18px;width:18px;height:18px;margin-top:2px;
    border:1.5px solid var(--ink);border-radius:var(--radius);background:var(--ink);position:relative}
  .agree .box::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;
    border:solid var(--on-action);border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}
  .agree p{font-size:var(--t-sub);line-height:var(--lh-sub);color:var(--ink-2)}
  .agree u{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:4px;
    text-decoration-color:var(--underline)}
  /* 自造组件之二：验证码底线格 .otp —— 沿用底座「输入 = 一条底线」的语言。
     格子数按响应里的位数渲染，前端不写死；这张稿按 6 位画。 */
  .otp{display:flex;gap:10px;padding:14px var(--rule) 0}
  .otp b{flex:1;height:52px;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:24px;font-weight:400;color:var(--ink);
    border-bottom:var(--hair-w) solid var(--hair)}
  .otp b.f{border-bottom:2px solid var(--ink)}
</style></head><body><div class="phone">

<div class="sb"><span>21:47</span><span class="sb__r">
  <span class="sb__s"><i></i><i></i><i></i><i></i></span><span class="sb__b"></span>
</span></div>

<div class="flow">
  <div class="head">
    <button class="link" style="min-height:auto;padding:0;font-size:var(--t-sub)">× 关闭</button>
    <span>未登录</span>
  </div>

  <div class="pad" style="padding-top:44px;padding-bottom:36px">
    <h1 class="display">登录</h1>
    <p class="body body--2" style="margin-top:14px">验证码发到了这个号上。</p>
  </div>

  <!-- 手机号保留、可改；改号即停倒计时并清验证码 -->
  <div class="field" style="border-bottom:var(--hair-w) solid var(--hair)">
    <label class="eyebrow" for="tel" style="flex:0 0 40px">手机</label>
    <input id="tel" value="138 0013 8000" aria-label="手机号，已填 138 0013 8000">
    <button class="link" style="min-height:auto;padding:0;font-size:var(--t-micro)">清除</button>
  </div>
  <p class="field__msg" style="visibility:hidden">占位</p>

  <!-- 码错：格子清空、第一格保持聚焦、手机号不清 -->
  <div class="otp" role="group" aria-label="验证码，共 6 位，已清空">
    <b class="f"></b><b></b><b></b><b></b><b></b><b></b>
  </div>
  <p class="field__msg" role="alert">那条码不对，还能再试 3 次</p>

  <div class="pad" style="margin-top:10px">
    <button class="link" aria-disabled="true" tabindex="0" style="opacity:.35"
      aria-label="还需等待 52 秒才能重发，不可用">52 秒后可以重发</button>
  </div>
</div>

<div class="dock">
  <button class="btn-pri" aria-disabled="true" tabindex="0" aria-label="登录，还需填完验证码">登录</button>
  <div class="agree">
    <span class="box" role="checkbox" aria-checked="true" aria-label="已阅读并同意用户协议和隐私政策，已选中"></span>
    <p>已阅读并同意 <u>《用户协议》</u><u>《隐私政策》</u></p>
  </div>
  <div class="or"><span>或者</span></div>
  <button class="btn-ghost">通过 Apple 登录</button>
  <button class="btn-ghost">微信登录</button>
</div>
<div class="hi"></div>
</div></body></html>
