<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>成因① 无匹配 · 空态 TS-05 · Kubic v10 · M2</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="v10.css"><style>
  body{zoom:2}
  .back{display:inline-flex;align-items:center;min-height:44px;margin:-14px 0;padding:0 4px;
        font-size:var(--t-micro);color:var(--ink-2);letter-spacing:.3px}
  .card{padding:18px var(--rule) 16px}
  .photo{display:flex;align-items:center;gap:10px;margin-top:12px}
  .photo i{display:block;width:44px;height:44px;background:var(--fill-skeleton);
           border:var(--hair-w) solid var(--hair);border-radius:var(--radius)}
  .state{padding:26px var(--rule) 0}
  .state .display{font-size:26px;line-height:34px}
  .state .say{margin-top:10px;font-size:var(--t-body);line-height:var(--lh-body);color:var(--ink)}
  .state .say--2{margin-top:6px;font-size:var(--t-sub);line-height:var(--lh-sub);color:var(--ink-2)}
  .act{padding:24px var(--rule) 0}
</style></head><body><div class="phone">

<div class="sb"><span>21:47</span><span class="sb__r">
  <span class="sb__s"><i></i><i></i><i></i><i></i></span><span class="sb__b"></span>
</span></div>

<div class="flow">
  <div class="head">
    <button class="back">‹ 返回</button>
    <span>7 条还没对上</span>
  </div>

  <div class="band card">
    <p class="eyebrow">昨天 21:40 · 没写来源</p>
    <p class="body"><i>图片记录</i></p>
    <div class="photo"><i aria-hidden="true"></i><span class="sub">原图 1 张 · 只在这台设备上</span></div>
  </div>

  <!-- 状态位 · TS-05 无匹配：认过了，丢弃是结果，不是失败 -->
  <div class="state">
    <p class="display">没对上</p>
    <p class="say">这条没能对上任何考点。考点表里没有匹配的一条，不是这条记录记错了。</p>
    <p class="say--2">对不上就不挂 —— 不会替你硬凑一个最像的。</p>
  </div>

  <!-- 主动作 = 唯一不依赖模型的那条路；这一态没有「再试一次」 -->
  <div class="act">
    <button class="btn-pri">自己挑一个</button>
    <p style="margin-top:10px;text-align:center"><button class="link">就这样留着</button></p>
  </div>
</div>

<div class="dock">
  <button class="link link--body" style="width:100%;justify-content:center">跳过这条</button>
</div>
<div class="hi"></div>
</div></body></html>
