<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>U7.4+U7.7 确认页 · Kubic M7 v10</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="v10.css"><style>
  body{zoom:2}
  /* 确认页：档位·价格·次数 → 通道 → 退款说明格(U7.7：现在一个字都不写) → 协议(默认不勾) → 去支付。
     返回任何时候可用；退回购买屏不弹「确定放弃购买吗」。 */
  .n{font-family:var(--font-display);font-weight:400;font-variant-numeric:tabular-nums lining-nums}
  .back{margin:-14px 0;padding:14px 10px 14px 0;font-size:var(--t-micro);color:var(--ink-2)}
  .ck{flex:0 0 18px;width:18px;height:18px;border:1.5px solid var(--ink);
      border-radius:var(--radius);margin-top:3px}
  .slot-refund{margin-top:22px;padding:12px var(--rule) 26px;
               border-top:var(--hair-w) solid var(--hair)}
</style></head><body><div class="phone">

<div class="sb"><span>21:47</span><span class="sb__r">
  <span class="sb__s"><i></i><i></i><i></i><i></i></span><span class="sb__b"></span>
</span></div>

<div class="flow">
  <div class="head">
    <button class="back" aria-label="返回">‹ 返回</button>
    <span>确认这一笔</span>
  </div>

  <p class="eyebrow pad" style="margin-top:24px;margin-bottom:2px">这一笔</p>
  <h1 class="display pad" style="margin-top:2px">记多点</h1>
  <p class="pad" style="margin-top:10px"><span class="n" style="font-size:44px;line-height:52px">¥ 12.00</span>
    <span class="sub" style="margin-left:10px">每月</span></p>
  <p class="sub pad" style="margin-top:4px">记录识别 200 次 · 问 AI 60 次</p>
  <p class="eyebrow pad" style="margin-top:6px">这个价格是这台设备上的价格</p>

  <p class="eyebrow pad" style="margin-top:26px;margin-bottom:2px">支付方式</p>
  <p class="body pad" style="margin-top:2px">◉ Apple 内购</p>

  <!-- U7.7 退款说明格：位置在通道之下、协议之上。裁定之前一个字都不写：
       不写「不支持退款」，也不写任何暗示随时可退的话。 -->
  <div class="slot-refund">
    <p class="eyebrow">退款说明</p>
  </div>

  <div class="pad" style="display:flex;gap:12px;min-height:44px;align-items:flex-start;
       padding-top:12px;border-top:var(--hair-w) solid var(--hair)">
    <span class="ck" aria-hidden="true"></span>
    <span class="body">同意购买协议</span>
  </div>
</div>

<div class="dock">
  <button class="btn-pri">去支付</button>
</div>
<div class="hi"></div>
</div></body></html>
